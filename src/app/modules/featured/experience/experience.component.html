<section id="experience" class="scroll-mt-24">
  <span class="panel-label">Experience</span>

  <div appSpotlight class="tile mt-4 divide-y divide-[var(--border)]">
    <div *ngFor="let exp of experiences" class="p-4 sm:p-6">
      <!-- Company Header -->
      <div class="flex items-start flex-wrap sm:flex-nowrap gap-4">
        <img
          [src]="exp.logo"
          alt="{{ exp.company }} logo"
          class="w-10 h-10 rounded-lg object-cover border border-subtle shrink-0"
        />
        <div>
          <h3 class="text-primary font-heading font-semibold text-md sm:text-lg">{{ exp.company }}</h3>
          <p class="text-muted text-sm sm:text-base">{{ exp.type }} &middot; {{ exp.duration }}</p>
        </div>
      </div>

      <!-- Roles Timeline -->
      <div class="ml-3 space-y-4 sm:space-y-6 mt-5 sm:mt-6">
        <div
          class="flex items-start relative"
          *ngFor="let role of exp.roles; let last = last"
        >
          <!-- Vertical Bar -->
          <div
            *ngIf="!last"
            class="absolute h-full border-l-2 border-subtle left-[0.31rem] top-[1.3rem]"
          ></div>

          <!-- Timeline Dot -->
          <span class="w-2.5 h-2.5 sm:w-3 sm:h-3 rounded-full mr-2 sm:mr-3 mt-1 z-10 flex-shrink-0 bg-[var(--accent)] shadow-[0_0_0_4px_var(--accent-soft)]"></span>

          <!-- Role Details -->
          <div class="px-1 sm:px-2 lg:px-4 min-w-0 flex-1">
            <h4 class="text-sm sm:text-base text-primary font-medium">{{ role.title }}</h4>
            <p class="text-muted text-xs sm:text-sm">
              {{ role.duration }} &middot; {{ role.months }}
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
