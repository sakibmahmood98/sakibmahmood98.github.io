<section class="flex flex-col lg:sticky lg:top-0 lg:max-h-screen lg:w-[75%] md:w-[70%] lg:flex-col lg:justify-between ">
  <div>
    <h1 class="text-4xl font-bold tracking-tight text-lightest-slate sm:text-5xl">
      <a [routerLink]="['/']">Sakib Mahmood Seaum</a>
    </h1>
    <h2 class="mt-3 text-lg font-medium tracking-tight text-black-200 sm:text-xl">
      Senior Software Engineer I
    </h2>
    <p class="mt-4 max-w-xs leading-normal">
      Problem solver in code, still debugging life :P
    </p>
    <nav class="hidden md:block lg:block" aria-label="In-page jump links">
      <ul class="mt-16 w-max">
        <li *ngFor="let link of navLinks">
          <a [href]="link.href" (click)="setActiveLink(link)"
              class="group flex items-center py-3" >
            <span class="nav-indicator mr-4 h-px w-8 bg-slate-600 transition-all group-hover:w-16 group-hover:bg-slate-200 group-focus-visible:w-16 group-focus-visible:bg-slate-200 motion-reduce:transition-none"  [ngClass]="{ 'w-16 bg-slate-200 ': link.active }" ></span>

            <span class="nav-text text-xs font-bold uppercase tracking-widest text-slate-500 group-hover:text-slate-200 group-focus-visible:text-slate-200" [ngClass]="{ 'text-slate-100 ': link.active }" >
              {{ link.text }}
            </span>
          </a>
        </li>
      </ul>
    </nav>
  </div>
  <!-- ... existing code ... -->

  <ul class="ml-1 mt-8 flex items-center" aria-label="Social media">
    <li *ngFor="let social of socialLinks" class="mr-5 shrink-0 text-xs">
      <a class="block hover:text-slate-200" [href]="social.url" target="_blank" rel="noreferrer noopener"
         [attr.aria-label]="social.label" [title]="social.title">

        <span class="sr-only">{{ social.label }}</span>

        <svg [attr.viewBox]="social.viewBox" fill="white" class="h-6 w-6" aria-hidden="true">
          <path [attr.d]="social.pathD"></path>
        </svg>
        <img [src]="social.iconUrl" alt="" class="ml-2 h-6 w-6 icon ">
      </a>
    </li>
  </ul>

  <!-- ... rest of code ... -->
</section>
