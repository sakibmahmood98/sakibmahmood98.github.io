<header class="sticky top-0 z-50 backdrop-blur-xl border-b border-subtle" style="background-color: var(--bg-glass);">
  <div class="container mx-auto px-4">
    <div class="flex items-center justify-between h-16 sm:h-[4.5rem]">

      <!-- Wordmark -->
      <a [routerLink]="['/']" (click)="scrollToTop()" class="focus-ring group flex items-center gap-2.5">
        <span class="grid place-items-center h-8 w-8 rounded-lg font-heading font-bold text-sm bg-[var(--accent-soft)] text-accent border border-subtle">SM</span>
        <span class="hidden sm:inline font-heading font-semibold text-sm text-primary">Sakib Mahmood</span>
      </a>

      <!-- Jump links -->
      <nav class="hidden md:flex items-center gap-1" aria-label="In-page jump links">
        <a *ngFor="let link of jumpLinks" [href]="link.href" (click)="goToSection(link.id, $event)"
           class="focus-ring px-3 py-2 rounded-full text-sm font-medium text-secondary hover:text-primary hover:bg-elevated transition-colors duration-200">
          {{ link.text }}
        </a>
        <a routerLink="/projects"
           class="focus-ring px-3 py-2 rounded-full text-sm font-medium text-secondary hover:text-primary hover:bg-elevated transition-colors duration-200">
          Archive
        </a>
      </nav>

      <!-- Actions -->
      <div class="flex items-center gap-2 sm:gap-3">
        <button
          type="button"
          (click)="theme.toggle()"
          class="focus-ring grid place-items-center h-9 w-9 rounded-full border border-subtle text-secondary hover:text-accent hover:border-subtle-strong transition-colors duration-200"
          [attr.aria-label]="theme.isLight() ? 'Switch to dark theme' : 'Switch to light theme'"
          [attr.title]="theme.isLight() ? 'Switch to dark theme' : 'Switch to light theme'">
          <svg *ngIf="!theme.isLight()" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
          </svg>
          <svg *ngIf="theme.isLight()" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 3v1.5m0 15V21m9-9h-1.5M4.5 12H3m15.36 6.36l-1.06-1.06M6.7 6.7L5.64 5.64m12.72 0l-1.06 1.06M6.7 17.3l-1.06 1.06M16.5 12a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z" />
          </svg>
        </button>

        <a [href]="'mailto:' + email"
           class="focus-ring inline-flex items-center gap-1.5 rounded-full px-4 py-2 text-xs sm:text-sm font-semibold transition-transform duration-200 hover:scale-105"
           style="background-color: var(--accent); color: var(--bg);">
          Say hi
        </a>
      </div>
    </div>
  </div>
</header>
