<section class="flex flex-col lg:sticky lg:top-0 lg:max-h-screen lg:w-[75%] md:w-[70%] lg:flex-col lg:justify-between ">
  <div>
    <h1 class="text-4xl font-bold tracking-tight text-black-200 sm:text-5xl">
      <a [routerLink]="['/']">Sakib Mahmood Seaum</a>
    </h1>
    <h2 class="mt-3 text-lg font-medium tracking-tight text-black-200 sm:text-xl">
      Front End Engineer
    </h2>
    <p class="mt-4 max-w-xs leading-normal">
      I build accessible, pixel-perfect digital experiences for the web.
    </p>
    <nav class="hidden md:block lg:block" aria-label="In-page jump links">
      <ul class="mt-16 w-max">
        <li *ngFor="let link of navLinks">
          <a [routerLink]="link.href" [class.active]="link.active" class="group flex items-center py-3">
            <span class="nav-indicator mr-4 h-px w-8 bg-slate-600 transition-all group-hover:w-16 group-hover:bg-slate-200 group-focus-visible:w-16 group-focus-visible:bg-slate-200 motion-reduce:transition-none"></span>
            <span class="nav-text text-xs font-bold uppercase tracking-widest text-slate-500 group-hover:text-slate-200 group-focus-visible:text-slate-200">
              {{ link.text }}
            </span>
          </a>
        </li>
      </ul>
    </nav>
  </div>

  <ul class="ml-1 mt-8 flex items-center" aria-label="Social media">
    <li *ngFor="let social of socialLinks" class="mr-5 shrink-0 text-xs">
      <a class="block hover:text-slate-200" [href]="social.url" target="_blank" rel="noreferrer noopener" [attr.aria-label]="social.label" [title]="social.title">
        <span class="sr-only">{{ social.label }}</span>
        <svg [attr.viewBox]="social.viewBox" fill="currentColor" class="h-6 w-6" aria-hidden="true">
          <path [attr.d]="social.pathD"></path>
        </svg>
      </a>
    </li>
  </ul>
</section>
