<section id="education" class="scroll-mt-24">
  <span class="panel-label">Education</span>

  <div appSpotlight class="tile mt-4 divide-y divide-[var(--border)]">
    <div *ngFor="let job of jobs" class="flex flex-col sm:flex-row sm:items-center gap-4 p-4 sm:p-6">
      <img [src]="job.logoUrl" alt="{{ job.position }} logo"
           class="h-14 w-14 rounded-xl object-contain bg-elevated border border-subtle p-1.5 shrink-0" />
      <div class="min-w-0 flex-1">
        <h3 class="text-primary font-heading font-semibold text-sm sm:text-base">{{ job.position }}</h3>
        <p class="mt-1.5 text-xs sm:text-sm leading-relaxed text-secondary">{{ job.description }}</p>
      </div>
      <p class="shrink-0 text-xs sm:text-sm text-muted font-mono-ui whitespace-nowrap">{{ job.startYear }} &ndash; {{ job.endYear }}</p>
    </div>
  </div>
</section>
