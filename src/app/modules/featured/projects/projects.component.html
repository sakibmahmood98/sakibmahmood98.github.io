<!-- HTML Template (e.g., my-component.component.html) -->
<div class="container mx-auto min-h-screen px-4">
  <section class="py-8 md:py-24">
    <!-- Back Button -->
    <button
      (click)="goBack()"
      class="group flex items-center gap-2 mb-6 text-gray-400 hover:text-white transition-colors duration-200">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 transition-transform duration-200 group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span class="text-sm font-medium">Back</span>
    </button>

    <h1 class="text-3xl sm:text-4xl md:text-5xl font-bold mb-8 sm:mb-8 md:mb-8 bg-gradient-to-r from-blue-400 to-purple-600 text-transparent bg-clip-text">All Projects</h1>

    <!-- Projects Grid -->
    <div class="space-y-8">
      <div *ngFor="let project of projects" class="group relative">
        <!-- Card -->
        <div class="bg-gray-900/50 backdrop-blur-sm rounded-2xl border border-gray-800 hover:border-gray-700 transition-all duration-300 p-6 md:p-8 hover:shadow-2xl hover:shadow-purple-900/10 cursor-pointer">
          <!-- Year Badge -->
          <div class="absolute -top-3 -right-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white px-4 py-1.5 rounded-full text-sm font-semibold shadow-lg">
            {{ project.year }}
          </div>

          <div class="space-y-4">
            <!-- Title -->
            <div>
              <h3 class="text-xl md:text-2xl font-bold text-white group-hover:text-blue-400 transition-colors duration-300 leading-tight">
                {{ project.project }}
              </h3>
              <p class="text-gray-400 mt-2 font-medium">&#64; {{ project.madeAt }}</p>
            </div>

            <!-- Description -->
            <div class="text-gray-300 leading-relaxed text-sm md:text-base" [innerHTML]="project.description">
            </div>

            <!-- Technologies -->
            <div class="pt-4">
              <div class="flex flex-wrap gap-2">
                <ng-container *ngFor="let tech of project.builtWith">
                  <span class="inline-block text-xs md:text-sm px-3 py-1.5 rounded-full text-white font-medium transition-all duration-200 hover:scale-105 hover:shadow-lg bg-gradient-to-r from-gray-600 to-gray-700">
                    {{ tech }}
                  </span>
                </ng-container>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
