<div class="min-h-screen bg-base">
  <app-nav></app-nav>
  <div class="container mx-auto px-4">
    <section class="py-10 md:py-16">
      <!-- Back Button -->
      <button
        (click)="goBack()"
        class="group focus-ring flex items-center gap-2 mb-8 sm:mb-10 text-secondary hover:text-primary transition-colors duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transition-transform duration-200 group-hover:-translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span class="text-sm font-medium">Back</span>
      </button>

      <span class="panel-label">Full archive</span>
      <h1 class="font-heading text-3xl sm:text-4xl md:text-5xl font-bold mt-3 mb-3 gradient-text">
        All Projects
      </h1>
      <p class="text-secondary text-sm sm:text-base max-w-2xl mb-10 sm:mb-14">
        {{ projects.length }} projects shipped across sales enablement, logistics, ticketing, IoT and generative AI &mdash; mostly built at Brain Station 23.
      </p>

      <!-- Projects Grid -->
      <div class="space-y-5 sm:space-y-6">
        <div *ngFor="let project of projects" [id]="project.slug" appSpotlight
             class="tile group p-5 sm:p-6 md:p-8 scroll-mt-8"
             [ngClass]="{ 'tile-highlight': project.slug === highlightedSlug }">
          <div class="flex items-start justify-between gap-4 mb-2">
            <div>
              <h3 class="font-heading text-lg sm:text-xl md:text-2xl font-semibold text-primary group-hover:text-accent transition-colors duration-300 leading-snug">
                {{ project.project }}
              </h3>
              <p class="text-muted mt-1.5 text-sm font-medium">&#64; {{ project.madeAt }}</p>
            </div>
            <span class="shrink-0 font-mono-ui text-xs sm:text-sm text-accent bg-[var(--accent-soft)] border border-subtle rounded-full px-3 py-1">
              {{ project.year }}
            </span>
          </div>

          <!-- Description -->
          <div class="text-secondary leading-relaxed text-sm md:text-base mt-3" [innerHTML]="project.description">
          </div>

          <!-- Technologies -->
          <div class="pt-5 mt-5 border-t border-subtle">
            <div class="flex flex-wrap gap-2">
              <ng-container *ngFor="let tech of project.builtWith">
                <span class="chip text-xs md:text-sm px-3 py-1 font-medium">
                  {{ tech }}
                </span>
              </ng-container>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
</div>
